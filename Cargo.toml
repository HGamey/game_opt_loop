[package]
name = "game_opt_loop"
version = "0.2.0"
edition = "2021"
description = "移动游戏自主优化与画质跃升闭环 (Rust) — 超分与插帧算子自主进化、显存零拷贝挂载、phonefarm 硬件闭环裁决"
authors = ["HGamey Team"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
errno = "0.3"
# 纯 Rust GLSL 前端 + SPIR-V 后端: 防爆编译门禁不依赖任何 C++ 工具链 (glslang/shaderc)。
# 注: naga 30.0.1 的 `glsl-in` 漏了 `front::interpolator` 的 feature gate
# (它被 gate 在 spv-in/wgsl-in 上), 故必须连带开启 `wgsl-in` 才能编译。
naga = { version = "30.0", default-features = false, features = ["glsl-in", "wgsl-in", "spv-out"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal", "time"] }

[lib]
name = "game_opt_loop"
path = "src/lib.rs"

[[bin]]
name = "game_opt_loop"
path = "src/main.rs"
