[package]
name = "game_opt_loop"
version = "0.1.0"
edition = "2021"
description = "移动游戏自主优化与画质跃升闭环 (Rust) — 超分与插帧算子自主进化、显存零拷贝挂载、phonefarm 硬件闭环裁决"
authors = ["HGamey Team"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "game_opt_loop"
path = "src/main.rs"
